name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Обновить данные из API OGame'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: npm run check

      - name: Fetch OGame data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: npm run fetch

      - name: Check stored data
        run: npm run check:data

      - name: Commit fetched data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update OGame data"
            git push
          fi

      - name: Build static site
        run: |
          mkdir -p dist/data
          cp -R public/. dist/
          if [ -d data/history ]; then cp -R data/history dist/data/history; fi

      - name: Verify static artifact
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/data/history/index.json
          node -e "const fs=require('fs'); const index=JSON.parse(fs.readFileSync('dist/data/history/index.json','utf8')); const base='dist/data/history/'+index.latest; const meta=JSON.parse(fs.readFileSync(base+'/meta.json','utf8')); if (!meta.generatedAt || !meta.highscoreTypes?.length) throw new Error('Invalid metadata'); for (const type of meta.highscoreTypes) { const rows=JSON.parse(fs.readFileSync(base+'/stats/'+type.id+'.json','utf8')); if (!Array.isArray(rows)) throw new Error('Invalid '+type.id+' ranking'); }"

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          curl -fsSL --retry 6 --retry-delay 10 "$url" -o /tmp/pages.html
          grep -q "OGame RU Dashboard" /tmp/pages.html
          curl -fsSL --retry 6 --retry-delay 10 "${url%/}/data/history/index.json" -o /tmp/history-index.json
          latest=$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('/tmp/history-index.json','utf8')).latest)")
          curl -fsSL --retry 6 --retry-delay 10 "${url%/}/data/history/$latest/meta.json" -o /tmp/meta.json
          curl -fsSL --retry 6 --retry-delay 10 "${url%/}/data/history/$latest/stats/0.json" -o /tmp/score.json
          node -e "const fs=require('fs'); const meta=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')); const rows=JSON.parse(fs.readFileSync('/tmp/score.json','utf8')); if (!meta.generatedAt || !meta.highscoreTypes?.length || !Array.isArray(rows) || !rows.every(row => Object.hasOwn(row, 'scoreDelta'))) throw new Error('Invalid deployed data');"
