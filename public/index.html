<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OGame RU Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>OGame RU Dashboard</h1>
          <p id="metaLine">Загрузка данных...</p>
        </div>
        <div class="topbarActions">
          <div class="settings">
            <button id="columnSettingsButton" class="settingsButton" type="button" aria-expanded="false" aria-controls="columnSettingsPanel">
              <span class="settingsIcon" aria-hidden="true"></span>
              <span>Столбцы</span>
              <span class="settingsChevron" aria-hidden="true">▾</span>
            </button>
            <div id="columnSettingsPanel" class="settingsPanel" hidden>
              <div class="settingsTitle">Показать столбцы</div>
              <div id="columnSettings" class="settingsList"></div>
            </div>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Фильтры">
        <label>
          <span>Вселенная</span>
          <select id="universeFilter"></select>
        </label>
        <label>
          <span>Топ</span>
          <select id="limitFilter">
            <option value="100">100</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
            <option value="all">Все</option>
          </select>
        </label>
        <label>
          <span>Дата</span>
          <select id="historyFilter">
            <option value="latest">Актуальные</option>
          </select>
        </label>
        <label>
          <span>Статус</span>
          <select id="playerStatusFilter">
            <option value="all">Все игроки</option>
            <option value="active-only">Только активные (без РО и неактивных)</option>
            <option value="exclude-vacation">Скрыть РО</option>
            <option value="exclude-inactive">Скрыть неактивных (в том числе РО(i, I))</option>
          </select>
        </label>
        <label class="search">
          <span>Поиск</span>
          <input id="searchInput" type="search" placeholder="Ник или альянс">
        </label>
      </section>

      <nav id="tabs" class="tabs" aria-label="Тип статистики"></nav>

      <section class="status" id="statusBox" hidden></section>

      <section class="tableWrap">
        <table>
          <thead>
            <tr>
              <th class="rank" data-column="rank">Место</th>
              <th data-column="displayName">Ник</th>
              <th data-column="allianceTag">Альянс</th>
              <th id="scoreHeader" class="sortableHeader" data-column="score">
                <button id="scoreSortButton" type="button" aria-label="Сортировать по очкам от большего к меньшему">
                  <span id="scoreHeaderLabel">Очки</span>
                  <span id="scoreSortIndicator" class="sortIndicator" aria-hidden="true">↓</span>
                </button>
              </th>
              <th id="scoreDeltaHeader" class="sortableHeader" data-column="scoreDelta">
                <button id="scoreDeltaSortButton" type="button" aria-label="Сортировать по изменению за день">
                  <span>За день</span>
                  <span class="sortIndicator" aria-hidden="true"></span>
                </button>
              </th>
              <th data-column="scoreBreakdown">Состав очков</th>
              <th data-column="universeName">Вселенная</th>
              <th id="positionHeader" data-column="position">Топ в своей вселенной</th>
              <th class="columnFilterHeader" data-column="speed" data-filter-key="speed">
                <div class="columnFilter">
                  <button class="columnFilterButton" type="button" aria-expanded="false" aria-haspopup="listbox">Eco ▾</button>
                  <div class="columnFilterMenu" role="listbox" hidden></div>
                </div>
              </th>
              <th class="columnFilterHeader" data-column="speedFleetPeaceful" data-filter-key="speedFleetPeaceful">
                <div class="columnFilter">
                  <button class="columnFilterButton" type="button" aria-expanded="false" aria-haspopup="listbox">Мирный флот ▾</button>
                  <div class="columnFilterMenu" role="listbox" hidden></div>
                </div>
              </th>
              <th class="columnFilterHeader" data-column="speedFleetWar" data-filter-key="speedFleetWar">
                <div class="columnFilter">
                  <button class="columnFilterButton" type="button" aria-expanded="false" aria-haspopup="listbox">Боевой флот ▾</button>
                  <div class="columnFilterMenu" role="listbox" hidden></div>
                </div>
              </th>
              <th class="columnFilterHeader" data-column="debrisPercent" data-filter-key="debrisPercent">
                <div class="columnFilter">
                  <button class="columnFilterButton" type="button" aria-expanded="false" aria-haspopup="listbox">Лом ▾</button>
                  <div class="columnFilterMenu" role="listbox" hidden></div>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
