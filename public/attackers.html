<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Топ атакеры — OGame RU</title>
    <script>
      (() => {
        const storageKey = 'ogame-ru-theme';
        let theme = '';
        try { theme = localStorage.getItem(storageKey) || ''; } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20261104-hall-of-fame">
  </head>
  <body data-report="attackers">
    <main class="shell reportShell">
      <header class="topbar">
        <div>
          <h1 id="reportTitle">Топ атакеры</h1>
          <p id="metaLine">Загрузка данных...</p>
        </div>
        <button id="themeToggle" class="themeToggle" type="button" aria-pressed="false">
          <span id="themeToggleIcon" class="themeToggleIcon" aria-hidden="true">☾</span>
          <span id="themeToggleLabel">Тёмная</span>
        </button>
      </header>
      <nav class="siteNav" aria-label="Разделы сайта">
        <a href="index.html">Статистика</a>
        <a href="hall-of-fame.html">Зал славы</a>
        <a href="attackers.html" aria-current="page">Топ атакеры</a>
        <a href="losses.html">Потери</a>
      </nav>
      <section class="reportToolbar attackerToolbar" aria-label="Фильтры отчёта">
        <label>
          <span>Вселенная</span>
          <select id="universeFilter"></select>
        </label>
        <div class="attackerPeriodControl">
          <span>Период</span>
          <div id="attackerPeriodToggle" class="segmentedControl attackerSegmentedControl" aria-label="Период рейтинга атакеров">
            <select id="attackerMonthSelect" aria-label="Выбрать месяц"></select>
            <select id="attackerWeekSelect" aria-label="Выбрать календарную неделю"></select>
            <button type="button" data-attacker-period="7d" aria-pressed="false">7 дней</button>
            <button type="button" data-attacker-period="30d" aria-pressed="false">30 дней</button>
          </div>
        </div>
        <p id="reportLimitHint" class="reportLimitHint">Все вселенные — топ-30 · одна вселенная — топ-10</p>
      </section>
      <section class="status" id="statusBox" hidden></section>
      <section class="tableWrap reportTableWrap">
        <table class="reportTable">
          <thead><tr>
            <th class="rank">Место</th><th>Ник</th><th>Альянс</th>
            <th class="sortableHeader"><button id="periodSortButton" type="button"><span id="periodHeaderLabel">За период</span> <span id="periodSortIndicator">↓</span></button></th>
            <th id="fleetHeader" hidden>Флот</th>
            <th id="defenseHeader" hidden>Оборона</th>
            <th id="destroyedHeader" hidden>Уничтожены</th>
            <th class="sortableHeader"><button id="totalSortButton" type="button"><span id="totalHeaderLabel">Всего</span> <span id="totalSortIndicator"></span></button></th>
            <th>Вселенная</th><th>Эко</th><th>Мирный флот</th><th>Боевой флот</th><th>Лом</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </main>
    <script src="report-app.js?v=20261104-loss-labels" type="module"></script>
  </body>
</html>
